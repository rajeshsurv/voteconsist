[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rajeshsurv-voteconsist"
version = "0.1.0"
description = "统计各模型答案的一致程度与分歧点，给出置信度"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rajeshsurv" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rajeshsurv.github.io"
Repository = "https://github.com/rajeshsurv/voteconsist"
Issues = "https://github.com/rajeshsurv/voteconsist/issues"

[project.scripts]
voteconsist = "voteconsist:main"

[tool.setuptools]
py-modules = ["voteconsist"]
